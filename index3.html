<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360度パノラマアルバム3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .thumbnail {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            background: white;
        }
        
        .thumbnail:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        
        .thumbnail img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        
        .thumbnail-title {
            padding: 12px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        
        #viewer-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
        }
        
        #panorama {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        
        #panorama:active {
            cursor: grabbing;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .projection-select {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .nav-controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            display: flex;
            gap: 10px;
        }
        
        button {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        button:hover {
            background: white;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <h1>360度パノラマアルバム</h1>
    
    <div class="gallery" id="gallery"></div>
    
    <div id="viewer-container">
        <div class="controls">
            <select id="projectionSelect" class="projection-select">
                <option value="rectilinear">正射影</option>
                <option value="stereographic">ステレオグラフィック</option>
                <option value="fisheye">魚眼</option>
            </select>
            <button id="closeBtn">✕ 閉じる</button>
        </div>
        <div class="nav-controls">
            <button id="prevBtn">← 前へ</button>
            <button id="nextBtn">次へ →</button>
        </div>
        <div id="panorama"></div>
    </div>

    <script>
        // 画像の設定
        const images = [
            {
                title: 'パノラマ1',
                url: 'https://pannellum.org/images/alma.jpg'
            },
            {
                title: 'パノラマ2', 
                url: 'https://pannellum.org/images/cerro-toco-0.jpg'
            },
            {
                title: 'パノラマ3',
                url: 'https://pannellum.org/images/jfk.jpg'
            }
        ];

        let currentIndex = 0;
        let currentProjection = 'rectilinear';
        
        // Three.js変数
        let scene, camera, renderer, sphere, material;
        let isUserInteracting = false;
        let onPointerDownMouseX = 0, onPointerDownMouseY = 0;
        let lon = 0, onPointerDownLon = 0;
        let lat = 0, onPointerDownLat = 0;
        let phi = 0, theta = 0;

        // ギャラリーの生成
        const gallery = document.getElementById('gallery');
        images.forEach((img, index) => {
            const thumb = document.createElement('div');
            thumb.className = 'thumbnail';
            thumb.innerHTML = `
                <img src="${img.url}" alt="${img.title}">
                <div class="thumbnail-title">${img.title}</div>
            `;
            thumb.addEventListener('click', () => openViewer(index));
            gallery.appendChild(thumb);
        });

        // ビューアーを開く
        function openViewer(index) {
            currentIndex = index;
            document.getElementById('viewer-container').style.display = 'block';
            if (!renderer) {
                initViewer();
            }
            loadPanorama(images[index].url);
            updateNavButtons();
            animate();
        }

        // Three.jsビューアーの初期化
        function initViewer() {
            const container = document.getElementById('panorama');
            
            // シーン作成
            scene = new THREE.Scene();
            
            // カメラ作成
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.1);
            
            // レンダラー作成
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);
            
            // 球体ジオメトリ作成
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1); // 内側を向くように反転
            
            material = new THREE.MeshBasicMaterial();
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);
            
            // イベントリスナー
            container.addEventListener('pointerdown', onPointerDown);
            container.addEventListener('pointermove', onPointerMove);
            container.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);
        }

        // パノラマを読み込む
        function loadPanorama(url) {
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(url, (texture) => {
                material.map = texture;
                material.needsUpdate = true;
                updateProjection();
            });
        }

        // 射影方式の更新
        function updateProjection() {
            if (currentProjection === 'rectilinear') {
                camera.fov = 75;
                camera.setLens = undefined;
            } else if (currentProjection === 'stereographic') {
                camera.fov = 120;
                // ステレオグラフィック投影の設定
                camera.setLens = function(focalLength, frameHeight) {
                    if (frameHeight === undefined) frameHeight = 43.25;
                    this.fov = 2 * THREE.MathUtils.radToDeg(Math.atan(frameHeight / (focalLength * 2)));
                    this.updateProjectionMatrix();
                };
                camera.setLens(10);
            } else if (currentProjection === 'fisheye') {
                camera.fov = 150;
            }
            camera.updateProjectionMatrix();
        }

        // アニメーションループ
        function animate() {
            if (document.getElementById('viewer-container').style.display === 'none') {
                return;
            }
            requestAnimationFrame(animate);
            update();
        }

        function update() {
            lat = Math.max(-85, Math.min(85, lat));
            phi = THREE.MathUtils.degToRad(90 - lat);
            theta = THREE.MathUtils.degToRad(lon);

            const x = 500 * Math.sin(phi) * Math.cos(theta);
            const y = 500 * Math.cos(phi);
            const z = 500 * Math.sin(phi) * Math.sin(theta);

            camera.lookAt(x, y, z);
            renderer.render(scene, camera);
        }

        // マウス/タッチイベント
        function onPointerDown(event) {
            isUserInteracting = true;
            onPointerDownMouseX = event.clientX;
            onPointerDownMouseY = event.clientY;
            onPointerDownLon = lon;
            onPointerDownLat = lat;
        }

        function onPointerMove(event) {
            if (isUserInteracting) {
                lon = (onPointerDownMouseX - event.clientX) * 0.1 + onPointerDownLon;
                lat = (event.clientY - onPointerDownMouseY) * 0.1 + onPointerDownLat;
            }
        }

        function onPointerUp() {
            isUserInteracting = false;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ビューアーを閉じる
        document.getElementById('closeBtn').addEventListener('click', () => {
            document.getElementById('viewer-container').style.display = 'none';
        });

        // 前の画像
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                loadPanorama(images[currentIndex].url);
                updateNavButtons();
            }
        });

        // 次の画像
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                loadPanorama(images[currentIndex].url);
                updateNavButtons();
            }
        });

        // ナビゲーションボタンの状態更新
        function updateNavButtons() {
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex === images.length - 1;
        }

        // 射影方式の変更
        document.getElementById('projectionSelect').addEventListener('change', (e) => {
            currentProjection = e.target.value;
            updateProjection();
        });

        // ESCキーで閉じる
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('closeBtn').click();
            }
        });
    </script>
</body>
</html>
