<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=0.5, user-scalable=yes">
    <title>EMOJIin360</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
         
            color: white;
            display: flex;
            flex-direction: column;
        }
        
        #fileInput {
            margin-top: 10px;
            padding: 8px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        #emojiInput {
            margin-top: 10px;
            padding: 8px;
            background: #444;
            color: white;
            border: none;
            border-radius: 5px;
            width: 150px;
        }
        
 
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <input type="file" id="fileInput" accept="image/*">
            
            <input type="text" id="emojiInput" maxlength="17" placeholder="🎃❄️🍁など">
        </div>
        
  
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, sphere, pumpkins = [];
        let isMouseDown = false;
        let previousMousePosition = { x: 0, y: 0 };
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let initialPinchDistance = null;
        let initialFov = 75; // 初期FOV
        let pumpkinTexture = null; // 共有テクスチャ
        let currentEmoji = '🎃'; // デフォルト絵文字

        // シーンの初期化
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(initialFov, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);
            
            const geometry = new THREE.SphereGeometry(50, 64, 32);
            const material = new THREE.MeshBasicMaterial({ 
                side: THREE.BackSide,
                color: 0x333333 
            });
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);
            
            // sample.jpgを起動時に読み込む
            const loader = new THREE.TextureLoader();
            loader.load(
                './sample.jpg',
                function(texture) {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    texture.flipY = true;
                    texture.wrapS = THREE.RepeatWrapping;
                    texture.wrapT = THREE.RepeatWrapping;
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = texture.image.width;
                    canvas.height = texture.image.height;
                    ctx.scale(-1, 1);
                    ctx.drawImage(texture.image, -texture.image.width, 0);
                    const flippedTexture = new THREE.CanvasTexture(canvas);
                    flippedTexture.mapping = THREE.EquirectangularReflectionMapping;
                    flippedTexture.flipY = true;
                    flippedTexture.wrapS = THREE.RepeatWrapping;
                    flippedTexture.wrapT = THREE.RepeatWrapping;
                    const newMaterial = new THREE.MeshBasicMaterial({ 
                        map: flippedTexture,
                        side: THREE.BackSide,
                        color: 0xffffff,
                        transparent: false,
                        opacity: 1.0
                    });
                    sphere.material = newMaterial;
                },
                undefined,
                function(err) {
                    console.error('sample.jpgの読み込みに失敗しました:', err);
                    alert('sample.jpgの読み込みに失敗しました。デフォルトの灰色表示になります。');
                }
            );
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 1);
            scene.add(ambientLight);
            
            setupMouseEvents();
            setupEmojiInput();
            window.addEventListener('resize', onWindowResize);
            setInterval(createPumpkin, 1000); // カボチャの生成頻度を2倍に
            animate();
        }
        
        // 絵文字入力のセットアップ
        function setupEmojiInput() {
            const emojiInput = document.getElementById('emojiInput');
            emojiInput.addEventListener('input', function() {
                const input = emojiInput.value.trim();
                currentEmoji = input.length > 0 ? input.slice(0, 17) : '🎃';
                pumpkinTexture = null; // テクスチャをリセットして再生成
                // 既存の絵文字を更新
                pumpkins.forEach(pumpkin => {
                    pumpkin.material.map = createPumpkinTexture();
                    pumpkin.material.needsUpdate = true;
                });
            });
        }
        
        // ファイル読み込み処理
        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        ctx.scale(-1, 1);
                        ctx.drawImage(img, -img.width, 0);
                        const texture = new THREE.CanvasTexture(canvas);
                        texture.mapping = THREE.EquirectangularReflectionMapping;
                        texture.flipY = true;
                        texture.wrapS = THREE.RepeatWrapping;
                        texture.wrapT = THREE.RepeatWrapping;
                        const newMaterial = new THREE.MeshBasicMaterial({ 
                            map: texture,
                            side: THREE.BackSide,
                            color: 0xffffff,
                            transparent: false,
                            opacity: 1.0
                        });
                        sphere.material = newMaterial;
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        
        // 絵文字のテクスチャを作成（共有）
        function createPumpkinTexture() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const fontSize = 48;
            const charWidth = fontSize * 0.6; // 1文字の幅（近似）
            const textWidth = currentEmoji.length * charWidth; // 文字列全体の幅
            canvas.width = Math.max(64, textWidth); // 文字列長さに応じた幅
            canvas.height = 64;
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.font = `${fontSize}px Arial`;
            context.fillStyle = 'white';
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText(currentEmoji, canvas.width / 2, canvas.height / 2);
            
            if (pumpkins.length > 200) {
                scene.remove(pumpkins[0]);
                pumpkins.shift();
            }
            
            return new THREE.CanvasTexture(canvas);
        }
        
        // 絵文字作成（PlaneGeometryでMeshを使用）
        function createPumpkin() {
            if (!pumpkinTexture) pumpkinTexture = createPumpkinTexture();
            
            const charWidth = 48 * 0.6; // 1文字の幅（近似）
            const planeWidth = Math.max(3, (currentEmoji.length * charWidth) / 16); // ジオメトリ幅を調整
            const geometry = new THREE.PlaneGeometry(planeWidth, 3);
            const material = new THREE.MeshBasicMaterial({ 
                map: pumpkinTexture,
                transparent: true,
                side: THREE.DoubleSide // 両面表示で裏返り対応
            });
            const pumpkin = new THREE.Mesh(geometry, material);
            
            pumpkin.position.set(
                (Math.random() - 0.5) * 80,
                40 + Math.random() * 20,
                (Math.random() - 0.5) * 80
            );
            
            pumpkin.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    -0.1 - Math.random() * 0.06,//-0.05 - Math.random() * 0.03
                    (Math.random() - 0.5) * 0.02
                ),
                rotationSpeedX: Math.random() * 0.02, // X軸回転速度
                rotationSpeedY: Math.random() * 0.02  // Y軸回転速度
            };
            
            scene.add(pumpkin);
            pumpkins.push(pumpkin);
        }
        
        // 絵文字のアニメーション
        function updatePumpkins() {
            for (let i = pumpkins.length - 1; i >= 0; i--) {
                const pumpkin = pumpkins[i];
                
                // 位置更新
                pumpkin.position.add(pumpkin.userData.velocity);
                
                // X軸およびY軸で回転（裏返る動き）
                pumpkin.rotation.x += pumpkin.userData.rotationSpeedX;
                pumpkin.rotation.y += pumpkin.userData.rotationSpeedY;
                
                // 球体の底に到達したら削除
                if (pumpkin.position.y < -40) {
                    scene.remove(pumpkin);
                    pumpkins.splice(i, 1);
                }
                
                // 球体の壁に当たったら跳ね返り
                const distance = pumpkin.position.length();
                if (distance > 45) {
                    const normal = pumpkin.position.clone().normalize();
                    pumpkin.userData.velocity.reflect(normal);
                    pumpkin.userData.velocity.multiplyScalar(0.7);
                    pumpkin.position.copy(normal.multiplyScalar(45));
                }
            }
        }
        
        // マウスおよびタッチイベント設定
        function setupMouseEvents() {
            const canvas = renderer.domElement;
            
            canvas.addEventListener('mousedown', function(event) {
                isMouseDown = true;
                previousMousePosition = { x: event.clientX, y: event.clientY };
            });
            
            canvas.addEventListener('mouseup', function() {
                isMouseDown = false;
            });
            
            canvas.addEventListener('mousemove', function(event) {
                if (isMouseDown) {
                    const deltaX = event.clientX - previousMousePosition.x;
                    const deltaY = event.clientY - previousMousePosition.y;
                    euler.y -= deltaX * 0.005;
                    euler.x -= deltaY * 0.005;
                    euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                    previousMousePosition = { x: event.clientX, y: event.clientY };
                }
            });
            
            // マウスホイールでズーム
            canvas.addEventListener('wheel', function(event) {
                event.preventDefault();
                const zoomSpeed = 0.1;
                camera.fov += event.deltaY * zoomSpeed;
                camera.fov = Math.max(30, Math.min(120, camera.fov));
                camera.updateProjectionMatrix();
            });
            
            // タッチイベント
            canvas.addEventListener('touchstart', function(event) {
                event.preventDefault();
                if (event.touches.length === 1) {
                    isMouseDown = true;
                    const touch = event.touches[0];
                    previousMousePosition = { x: touch.clientX, y: touch.clientY };
                } else if (event.touches.length === 2) {
                    const touch1 = event.touches[0];
                    const touch2 = event.touches[1];
                    initialPinchDistance = Math.hypot(
                        touch1.clientX - touch2.clientX,
                        touch1.clientY - touch2.clientY
                    );
                }
            });
            
            canvas.addEventListener('touchend', function(event) {
                event.preventDefault();
                isMouseDown = false;
                initialPinchDistance = null;
            });
            
            canvas.addEventListener('touchmove', function(event) {
                event.preventDefault();
                if (event.touches.length === 1 && isMouseDown) {
                    const touch = event.touches[0];
                    const deltaX = touch.clientX - previousMousePosition.x;
                    const deltaY = touch.clientY - previousMousePosition.y;
                    euler.y -= deltaX * 0.005;
                    euler.x -= deltaY * 0.005;
                    euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                    camera.quaternion.setFromEuler(euler);
                    previousMousePosition = { x: touch.clientX, y: touch.clientY };
                } else if (event.touches.length === 2) {
                    const touch1 = event.touches[0];
                    const touch2 = event.touches[1];
                    const currentPinchDistance = Math.hypot(
                        touch1.clientX - touch2.clientX,
                        touch1.clientY - touch2.clientY
                    );
                    if (initialPinchDistance !== null) {
                        const pinchDelta = currentPinchDistance - initialPinchDistance;
                        const zoomSpeed = 0.05;
                        camera.fov -= pinchDelta * zoomSpeed;
                        camera.fov = Math.max(30, Math.min(120, camera.fov));
                        camera.updateProjectionMatrix();
                        initialPinchDistance = currentPinchDistance;
                    }
                }
            });
        }
        
        // ウィンドウリサイズ処理
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // アニメーションループ
        function animate() {
            requestAnimationFrame(animate);
            updatePumpkins();
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
