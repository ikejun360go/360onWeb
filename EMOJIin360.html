- Customizable falling emojis or text (up to 17 characters) / カスタマイズ可能な降る絵文字またはテキスト（最大17文字）

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=0.5, user-scalable=yes" />
  <title>EMOJIin360</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
      color: white;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #fileInput,
    #emojiInput {
      padding: 8px;
      background: #444;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 200px;
    }
    #emojiInput {
      cursor: text;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="controls">
      <input type="file" id="fileInput" accept="image/*" />
      <input type="text" id="emojiInput" maxlength="17" placeholder="🎃❄️🍁など" />
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --------------------------------------------
    // グローバル
    // --------------------------------------------
    let scene, camera, renderer, sphere, pumpkins = [];
    let isMouseDown = false;
    let previousMousePosition = { x: 0, y: 0 };
    let euler = new THREE.Euler(0, 0, 0, 'YXZ');
    let initialPinchDistance = null;
    const initialFov = 75; // 初期FOV
    let pumpkinTexture = null; // 共有テクスチャ
    let currentEmoji = '🎃'; // デフォルト絵文字

    // --------------------------------------------
    // 4096x2048 正規化ユーティリティ
    // --------------------------------------------
    const TARGET_W = 4096;
    const TARGET_H = 2048;

    // 入力画像を 2:1 に中心クロップ
    function computeCenterCrop2to1(imgW, imgH) {
      const targetRatio = 2.0;
      const srcRatio = imgW / imgH;
      if (Math.abs(srcRatio - targetRatio) < 1e-4) {
        return { sx: 0, sy: 0, sw: imgW, sh: imgH };
      }
      if (srcRatio > targetRatio) {
        // 横長 → 左右をカット
        const sw = Math.floor(imgH * targetRatio);
        const sx = Math.floor((imgW - sw) / 2);
        return { sx, sy: 0, sw, sh: imgH };
      } else {
        // 縦長 → 上下をカット
        const sh = Math.floor(imgW / targetRatio);
        const sy = Math.floor((imgH - sh) / 2);
        return { sx: 0, sy, sw: imgW, sh };
      }
    }

    // 画像 → 4096×2048（中心クロップ→リサイズ→水平反転）の CanvasTexture を作成
    function buildEquirectPOTTexture(img) {
      // 1) 2:1へ中心クロップ
      const { sx, sy, sw, sh } = computeCenterCrop2to1(img.width, img.height);
      const srcC = document.createElement('canvas');
      srcC.width  = sw;
      srcC.height = sh;
      const sctx = srcC.getContext('2d');
      sctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

      // 2) 4096×2048へ縮小しつつ水平反転
      const dstC = document.createElement('canvas');
      dstC.width  = TARGET_W;
      dstC.height = TARGET_H;
      const dctx = dstC.getContext('2d');
      dctx.scale(-1, 1); // 水平反転
      dctx.drawImage(srcC, 0, 0, sw, sh, -TARGET_W, 0, TARGET_W, TARGET_H);

      // 3) CanvasTexture（POTなので mipmap/anisotropy 有効に）
      const tex = new THREE.CanvasTexture(dstC);
      tex.needsUpdate = true;
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;

      // anisotropy（可能なら最大値から控えめに）
      try {
        const maxAniso = renderer?.capabilities?.getMaxAnisotropy?.() || 1;
        tex.anisotropy = Math.min(8, maxAniso);
      } catch (e) { /* no-op */ }

      return tex;
    }

    // 既存マテリアルを安全に差し替え
    function applyTextureToSphere(tex) {
      if (sphere?.material?.map) sphere.material.map.dispose?.();
      sphere?.material?.dispose?.();
      sphere.material = new THREE.MeshBasicMaterial({
        map: tex,
        side: THREE.BackSide,
        color: 0xffffff
      });
    }

    // --------------------------------------------
    // 初期化
    // --------------------------------------------
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(initialFov, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance',
        preserveDrawingBuffer: false
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (renderer.outputEncoding !== undefined) {
        renderer.outputEncoding = THREE.sRGBEncoding; // r128 系
      }
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      document.getElementById('container').appendChild(renderer.domElement);

      const geometry = new THREE.SphereGeometry(50, 64, 32);
      const material = new THREE.MeshBasicMaterial({
        side: THREE.BackSide,
        color: 0x333333
      });
      sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1);
      scene.add(ambientLight);

      // sample.jpg を 4096x2048 に正規化して貼り付け
      const loader = new THREE.TextureLoader();
      loader.load(
        './sample.jpg',
        (texture) => {
          const potTex = buildEquirectPOTTexture(texture.image);
          applyTextureToSphere(potTex);
        },
        undefined,
        (err) => {
          console.error('sample.jpgの読み込みに失敗しました:', err);
          alert('sample.jpgの読み込みに失敗しました。デフォルトの灰色表示になります。');
        }
      );

      setupMouseEvents();
      setupEmojiInput();
      window.addEventListener('resize', onWindowResize);
      setInterval(createPumpkin, 1000); // 1秒ごとに1つ生成
      animate();
    }

    // --------------------------------------------
    // 絵文字入力
    // --------------------------------------------
    function setupEmojiInput() {
      const emojiInput = document.getElementById('emojiInput');
      emojiInput.addEventListener('input', function () {
        const input = emojiInput.value.trim();
        currentEmoji = input.length > 0 ? input.slice(0, 17) : '🎃';
        pumpkinTexture = null; // テクスチャをリセットして再生成
        // 既存の絵文字を更新
        pumpkins.forEach(pumpkin => {
          pumpkin.material.map = createPumpkinTexture();
          pumpkin.material.needsUpdate = true;
        });
      });
    }

    // --------------------------------------------
    // ファイル読み込み
    // --------------------------------------------
    document.getElementById('fileInput').addEventListener('change', function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (e) {
        const img = new Image();
        img.onload = function () {
          const potTex = buildEquirectPOTTexture(img);
          applyTextureToSphere(potTex);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    // --------------------------------------------
    // 絵文字テクスチャ（CanvasTexture, NPOT安全設定）
    // --------------------------------------------
    function createPumpkinTexture() {
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const fontSize = 48;
      const charWidth = fontSize * 0.6; // 1文字幅（近似）
      const textWidth = currentEmoji.length * charWidth;
      canvas.width = Math.max(64, textWidth);
      canvas.height = 64;

      context.clearRect(0, 0, canvas.width, canvas.height);
      context.font = `${fontSize}px Arial`;
      context.fillStyle = 'white';
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.fillText(currentEmoji, canvas.width / 2, canvas.height / 2);

      if (pumpkins.length > 200) {
        scene.remove(pumpkins[0]);
        pumpkins.shift();
      }

      const t = new THREE.CanvasTexture(canvas);
      t.needsUpdate = true;
      t.generateMipmaps = false;              // NPOTなのでmipmap無効
      t.minFilter = THREE.LinearFilter;
      t.magFilter = THREE.LinearFilter;
      t.wrapS = THREE.ClampToEdgeWrapping;
      t.wrapT = THREE.ClampToEdgeWrapping;
      if (THREE.sRGBEncoding) t.encoding = THREE.sRGBEncoding;
      return t;
    }

    // --------------------------------------------
    // 絵文字エンティティ生成
    // --------------------------------------------
    function createPumpkin() {
      if (!pumpkinTexture) pumpkinTexture = createPumpkinTexture();

      const charWidth = 48 * 0.6; // 1文字の幅（近似）
      const planeWidth = Math.max(3, (currentEmoji.length * charWidth) / 16);
      const geometry = new THREE.PlaneGeometry(planeWidth, 3);
      const material = new THREE.MeshBasicMaterial({
        map: pumpkinTexture,
        transparent: true,
        side: THREE.DoubleSide
      });
      const pumpkin = new THREE.Mesh(geometry, material);

      pumpkin.position.set(
        (Math.random() - 0.5) * 80,
        40 + Math.random() * 20,
        (Math.random() - 0.5) * 80
      );

      pumpkin.userData = {
        velocity: new THREE.Vector3(
          (Math.random() - 0.5) * 0.02,
          -0.1 - Math.random() * 0.06,
          (Math.random() - 0.5) * 0.02
        ),
        rotationSpeedX: Math.random() * 0.02,
        rotationSpeedY: Math.random() * 0.02
      };

      scene.add(pumpkin);
      pumpkins.push(pumpkin);
    }

    // --------------------------------------------
    // 絵文字のアニメーション
    // --------------------------------------------
    function updatePumpkins() {
      for (let i = pumpkins.length - 1; i >= 0; i--) {
        const pumpkin = pumpkins[i];

        // 位置更新
        pumpkin.position.add(pumpkin.userData.velocity);

        // X/Y 回転（裏返り動き）
        pumpkin.rotation.x += pumpkin.userData.rotationSpeedX;
        pumpkin.rotation.y += pumpkin.userData.rotationSpeedY;

        // 球体の底に到達したら削除
        if (pumpkin.position.y < -40) {
          scene.remove(pumpkin);
          pumpkins.splice(i, 1);
          continue;
        }

        // 球体の壁に当たったら跳ね返り
        const distance = pumpkin.position.length();
        if (distance > 45) {
          const normal = pumpkin.position.clone().normalize();
          pumpkin.userData.velocity.reflect(normal);
          pumpkin.userData.velocity.multiplyScalar(0.7);
          pumpkin.position.copy(normal.multiplyScalar(45));
        }
      }
    }

    // --------------------------------------------
    // 入力（マウス/タッチ）
    // --------------------------------------------
    function setupMouseEvents() {
      const canvas = renderer.domElement;

      canvas.addEventListener('mousedown', (event) => {
        isMouseDown = true;
        previousMousePosition = { x: event.clientX, y: event.clientY };
      });

      canvas.addEventListener('mouseup', () => {
        isMouseDown = false;
      });

      canvas.addEventListener('mousemove', (event) => {
        if (!isMouseDown) return;
        const deltaX = event.clientX - previousMousePosition.x;
        const deltaY = event.clientY - previousMousePosition.y;
        euler.y -= deltaX * 0.005;
        euler.x -= deltaY * 0.005;
        euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
        camera.quaternion.setFromEuler(euler);
        previousMousePosition = { x: event.clientX, y: event.clientY };
      });

      // マウスホイールでズーム
      canvas.addEventListener('wheel', (event) => {
        event.preventDefault();
        const zoomSpeed = 0.1;
        camera.fov += event.deltaY * zoomSpeed;
        camera.fov = Math.max(30, Math.min(120, camera.fov));
        camera.updateProjectionMatrix();
      }, { passive: false });

      // タッチイベント
      canvas.addEventListener('touchstart', (event) => {
        event.preventDefault();
        if (event.touches.length === 1) {
          isMouseDown = true;
          const touch = event.touches[0];
          previousMousePosition = { x: touch.clientX, y: touch.clientY };
        } else if (event.touches.length === 2) {
          const [t1, t2] = event.touches;
          initialPinchDistance = Math.hypot(
            t1.clientX - t2.clientX,
            t1.clientY - t2.clientY
          );
        }
      }, { passive: false });

      canvas.addEventListener('touchend', (event) => {
        event.preventDefault();
        isMouseDown = false;
        initialPinchDistance = null;
      }, { passive: false });

      canvas.addEventListener('touchmove', (event) => {
        event.preventDefault();
        if (event.touches.length === 1 && isMouseDown) {
          const touch = event.touches[0];
          const deltaX = touch.clientX - previousMousePosition.x;
          const deltaY = touch.clientY - previousMousePosition.y;
          euler.y -= deltaX * 0.005;
          euler.x -= deltaY * 0.005;
          euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
          camera.quaternion.setFromEuler(euler);
          previousMousePosition = { x: touch.clientX, y: touch.clientY };
        } else if (event.touches.length === 2) {
          const [t1, t2] = event.touches;
          const currentPinchDistance = Math.hypot(
            t1.clientX - t2.clientX,
            t1.clientY - t2.clientY
          );
          if (initialPinchDistance !== null) {
            const pinchDelta = currentPinchDistance - initialPinchDistance;
            const zoomSpeed = 0.05;
            camera.fov -= pinchDelta * zoomSpeed;
            camera.fov = Math.max(30, Math.min(120, camera.fov));
            camera.updateProjectionMatrix();
            initialPinchDistance = currentPinchDistance;
          }
        }
      }, { passive: false });
    }

    // --------------------------------------------
    // リサイズ
    // --------------------------------------------
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --------------------------------------------
    // ループ
    // --------------------------------------------
    function animate() {
      requestAnimationFrame(animate);
      updatePumpkins();
      renderer.render(scene, camera);
    }

    // 起動
    init();
  </script>
</body>
</html>
